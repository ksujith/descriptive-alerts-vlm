[project]
name = "dalerts"
version = "0.1.0"
description = "LoRA fine-tuning of Qwen2-VL-2B for Wyze-style descriptive activity alerts on Charades clips"
requires-python = ">=3.10"
dependencies = [
    "av>=12.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed on the GPU box, not on the Mac.
train = [
    "torch>=2.4.0",
    "transformers>=4.49.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "qwen-vl-utils>=0.0.8",
    "bitsandbytes>=0.44.0",
    "sentencepiece",
]
eval = [
    "pycocoevalcap>=1.2",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
